[package]
name = "rmp-bridge-relay"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
serde = { version = "1.0", features = ["std"], default-features = false }
serde_derive = { version = "1.0", default-features = false }
serde_json = { version = "1.0", features = ["std", "preserve_order"], default-features = false }
tracing = { version = "0.1", features = ["std"], default-features = false }
tracing-subscriber = { version = "0.3", features = ["std", "fmt"], default-features = false }
ureq = { version = "3.5", default-features = false }
